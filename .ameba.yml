# Ameba configuration for anthropic-cr
# Documentation: https://github.com/crystal-ameba/ameba

# Files to lint
Globs:
  - "**/*.cr"
  - "!lib/**/*"

# Files to exclude from all rules
Excluded:
  - lib/

# Rule configurations
# See all rules: https://crystal-ameba.github.io/ameba/

# Lint rules - catch bugs and incorrect code
Lint/NotNil:
  Enabled: true
  Excluded:
    - spec/**/*  # not_nil! is acceptable in tests for assertions

Lint/UselessAssign:
  Enabled: true
  ExcludeTypeDeclarations: true
  Excluded:
    - examples/**/*  # Examples show API usage even if result isn't used

Lint/UnusedArgument:
  Enabled: true

Lint/Shadowing:
  Enabled: true

Style/IdenticalConditionalBranches:
  Enabled: true

Lint/RedundantCondition:
  Enabled: true

Style/UnlessElse:
  Enabled: true

# Style rules - enforce consistent code style
Style/RedundantBegin:
  Enabled: true

Style/RedundantReturn:
  Enabled: true

# Allow larger numbers without underscores in test fixtures
Style/LargeNumbers:
  Enabled: true
  IntMinDigits: 6

# Documentation rules - we'll enable these later
Documentation/DocumentationAdmonition:
  Enabled: false

# Metrics rules
Metrics/CyclomaticComplexity:
  Enabled: true
  MaxComplexity: 15
  Excluded:
    - examples/**/*  # Examples can be more complex for demonstration
    # Large case-dispatch tables (beta headers / tool type → beta mapping)
    - src/anthropic-cr/tools/server_tools.cr
    # Retry + rewrite + SigV4 path on Bedrock clients
    - src/anthropic-cr/bedrock/client.cr
    - src/anthropic-cr/bedrock/mantle_client.cr

# Performance rules
Performance/ChainedCallWithNoBang:
  Enabled: true

Performance/MapInsteadOfBlock:
  Enabled: true

# --- Ameba 1.7+ rules ---
# Disabled for now: they flood the existing codebase with style-only findings
# and are not part of the project's established conventions. Revisit later.
Style/RedundantNilInControlExpression:
  Enabled: false

Style/HeredocIndent:
  Enabled: false

Style/VerboseNilType:
  Enabled: false

Style/MultilineStringLiteral:
  Enabled: false

Style/MultilineCurlyBlock:
  Enabled: false

Lint/SpecEqWithBoolOrNilLiteral:
  Enabled: false

Lint/WhitespaceAroundMacroExpression:
  Enabled: false

Lint/UnusedRescueVariable:
  Enabled: false

Lint/ElseNil:
  Enabled: false
